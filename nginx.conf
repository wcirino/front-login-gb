server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Tenta carregar o arquivo real ($uri); se não achar, manda pro index.html
        # Isso permite que o Angular assuma o controle da rota digitada
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Trata erros de servidor de forma limpa
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
