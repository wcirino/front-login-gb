<div class="login-wrapper d-flex justify-content-center align-items-start">
    <div class="login-card shadow">
        <h3 class="text-center fw-bold mb-4">Acesso ao Sistema</h3>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
                <input type="text"
                       formControlName="username"
                       class="form-control form-control-lg"
                       placeholder="Login / Usuário" />

                <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
                    class="text-danger small mt-1">
                    <i class="bi bi-exclamation-circle"></i> Informe o seu usuário.
                </div>
            </div>

            <div class="mb-3">
                <input type="password"
                       formControlName="password"
                       class="form-control form-control-lg"
                       placeholder="Senha" />

                <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                    class="text-danger small mt-1">
                    <i class="bi bi-exclamation-circle"></i> Informe a sua senha.
                </div>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">Manter conectado</label>
            </div>

            <div class="d-flex justify-content-between mb-3 small">
                <a routerLink="/recuperar-login" class="text-decoration-none">Esqueci o login</a>
                <a routerLink="/recuperar-acesso" class="text-decoration-none">Esqueci a senha</a>
            </div>

            <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary w-100 py-3 fw-semibold">
                ENTRAR
            </button>
        </form>

        <div class="text-center mt-3 text-danger fw-bold" *ngIf="mensagem">
            <i class="bi bi-x-circle-fill"></i> {{ mensagem }}
        </div>
    </div>
</div>
