<div class="login-wrapper d-flex justify-content-center align-items-start">
    <div class="login-card shadow">
        <h3 class="text-center fw-bold mb-4">Recuperar Senha</h3>
        <p class="text-muted text-center mb-4">Informe seu login para enviarmos um link de redefinição.</p>

        <form [formGroup]="acessoForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
                <input type="text"
                       formControlName="username"
                       class="form-control form-control-lg"
                       placeholder="Login / Usuário" />

                <div *ngIf="acessoForm.get('username')?.touched && acessoForm.get('username')?.invalid"
                    class="text-danger small mt-1">
                    <i class="bi bi-exclamation-circle"></i> Informe o seu usuário.
                </div>
            </div>

            <button type="submit" [disabled]="acessoForm.invalid || loading" class="btn btn-primary w-100 py-3 fw-semibold">
                {{ loading ? 'ENVIANDO...' : 'ENVIAR LINK' }}
            </button>

            <div class="d-flex justify-content-between mt-3 small">
                <a routerLink="/login" class="text-decoration-none">Voltar ao Login</a>
                <a routerLink="/recuperar-login" class="text-decoration-none">Esqueci meu login</a>
            </div>
        </form>

        <div class="alert alert-success mt-4 text-center" *ngIf="emailDestino">
            <i class="bi bi-envelope-check-fill"></i> Link enviado para:<br>
            <strong class="fs-6">{{ emailDestino }}</strong>
        </div>

        <div class="text-center mt-3 text-danger fw-bold" *ngIf="mensagem && !emailDestino">
            <i class="bi bi-x-circle-fill"></i> {{ mensagem }}
        </div>
    </div>
</div>
