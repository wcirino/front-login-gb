<div class="login-wrapper d-flex justify-content-center align-items-start">
    <div class="login-card shadow">
        <h3 class="text-center fw-bold mb-4">Recuperar Login</h3>
        <p class="text-muted text-center mb-4">Informe seu e-mail cadastrado para localizar seu usuário.</p>

        <form [formGroup]="recuperarForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
                <input type="email"
                       formControlName="email"
                       class="form-control form-control-lg"
                       placeholder="E-mail" />

                <div *ngIf="recuperarForm.get('email')?.touched && recuperarForm.get('email')?.invalid"
                    class="text-danger small mt-1">
                    <i class="bi bi-exclamation-circle"></i> Informe um e-mail válido.
                </div>
            </div>

            <button type="submit" [disabled]="recuperarForm.invalid || loading" class="btn btn-primary w-100 py-3 fw-semibold">
                {{ loading ? 'PROCESSANDO...' : 'RECUPERAR USUÁRIO' }}
            </button>

            <div class="mt-3 text-center">
                <a routerLink="/login" class="text-decoration-none small">Voltar para o Login</a>
            </div>
        </form>

        <div class="alert alert-success mt-4 text-center" *ngIf="usernameRecuperado">
            <i class="bi bi-check-circle-fill"></i> Usuário encontrado: <br>
            <strong class="fs-5">{{ usernameRecuperado }}</strong>
        </div>

        <div class="text-center mt-3 text-danger fw-bold" *ngIf="mensagem">
            <i class="bi bi-x-circle-fill"></i> {{ mensagem }}
        </div>
    </div>
</div>
